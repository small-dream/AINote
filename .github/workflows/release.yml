name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签，例如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_TAG}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: pnpm release:check ${{ steps.vars.outputs.tag }}
      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          release_body=$(cat <<'EOF'
          ## 更新内容

          - Markdown 编辑器 P0 升级：查找/替换、撤销/重做、括号匹配、自动闭合、长行换行与列表续写。
          - 保存可靠性升级：保存成功前保留未保存状态，失败可重试，切换笔记前等待异步保存完成。
          - 多仓库缓存隔离：笔记内容缓存按仓库与路径区分，避免同路径串读。
          - 编辑/分栏/预览切换采用标准 Tabs 语义并支持键盘方向键。
          - 新增编辑器体验专项路线图 `docs/EDITOR_EXPERIENCE_PLAN.md`。

          - 新增全文搜索与 Cmd+K 命令面板：一键定位任意笔记（标题 + 正文，标题命中优先）。
          - 新增 Git 版本历史 / Diff / 回滚：查看单篇笔记提交历史、对比改动、一键恢复历史版本。
          - 新增图片/附件管理：拖放或工具栏选择导入到 `assets/`，自动插入 Markdown 引用并即时提交。
          - 新增标签系统与双链：`#标签` 提取、`[[双链]]` 点击跳转、反向链接面板与侧边栏标签索引。
          - 新增合并冲突图形化处理：本地 | 合并结果 | 远端三栏行级挑选，全部解决后自动同步。
          - 新增软删除回收站：删除笔记/目录移入回收站（随仓库 Git 同步），可恢复 / 彻底删除 / 清空。

          ## What's new

          - Markdown editor P0 upgrade: find/replace, undo/redo, bracket matching, auto-closing, line wrapping, and list continuation.
          - Hardened save reliability: dirty state is preserved until a successful save, failures can be retried, and note switching awaits async flush.
          - Isolated multi-repository note caches by repository and path.
          - Standardized Edit/Split/Preview tabs with keyboard arrow navigation.
          - Added the editor experience roadmap at `docs/EDITOR_EXPERIENCE_PLAN.md`.

          - Added full-text search and a Cmd+K command palette to jump to any note (title + body, title hits ranked first).
          - Added Git version history, per-file diff, and one-click rollback to any historical version.
          - Added image/attachment management: drag & drop or toolbar picker imports into `assets/`, inserts the Markdown reference, and commits immediately.
          - Added tags and backlinks: `#tag` extraction, `[[wiki-link]]` click-to-jump, a backlinks panel, and a sidebar tag index.
          - Added a graphical three-way merge for sync conflicts (Local | Merged | Remote with per-line picking), auto-syncing once all conflicts are resolved.
          - Added a soft-delete recycle bin: deleted notes/folders move to trash (synced with the Git repo), with restore / permanent delete / empty.

          ## 安装与更新

          - Windows：下载 `.msi` 或 `.exe` 安装包。
          - macOS：Apple Silicon（Apple 芯片）Mac 下载 `.dmg` 安装包。
          - Linux：下载 `.AppImage`、`.deb` 或 `.rpm` 安装包。
          - 本版本支持应用内更新；可在 **设置 → 软件更新** 中检查更新。
          - macOS 安装包未签名。若浏览器下载后显示“已损坏”，将应用移至“应用程序”目录后执行 `xattr -cr /Applications/AINote.app`。
          - Windows 安装包未签名，首次运行时可能出现 SmartScreen 提示；请确认下载来源为本 Release 页面。

          ---

          ## Install and update

          - Windows: download the `.msi` or `.exe` installer.
          - macOS: Apple Silicon Macs should download the `.dmg` installer.
          - Linux: download the `.AppImage`, `.deb`, or `.rpm` package.
          - In-app updates are available in **Settings → Software Updates**.
          - The macOS package is unsigned. If macOS says the browser-downloaded app is damaged, move it to Applications and run `xattr -cr /Applications/AINote.app`.
          - The Windows package is unsigned. SmartScreen may appear on first launch; verify that you downloaded it from this Release page.
          EOF
          )
          release_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null | grep -E '^[0-9]+$' || true)
          if [ -z "$release_id" ]; then
            release_id=$(gh api --method POST "repos/$REPO/releases" -f tag_name="$TAG" -f name="AINote $TAG" -f body="$release_body" -F draft=true --jq '.id')
          else
            gh api --method PATCH "repos/$REPO/releases/$release_id" -F draft=true -f body="$release_body" >/dev/null
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  publish-release:
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false >/dev/null
