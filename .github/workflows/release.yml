name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签，例如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_TAG}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: pnpm release:check ${{ steps.vars.outputs.tag }}
      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          release_body=$(node scripts/build-release-notes.mjs "$TAG")
          release_id=$(node scripts/resolve-release.mjs "$TAG" "$release_body")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: false

  publish-android:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Configure Android NDK toolchain
        run: |
          set -euo pipefail
          ndk_root=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          toolchain_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "$toolchain_bin/llvm-ranlib" ]; then
            echo "::error::未找到 Android NDK llvm-ranlib: $toolchain_bin/llvm-ranlib"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_BIN=$toolchain_bin" >> "$GITHUB_ENV"
      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable 未配置，无法生成可安装的 Android Release 包"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/ainote-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build Android APK and AAB
        env:
          RANLIB: ${{ env.ANDROID_TOOLCHAIN_BIN }}/llvm-ranlib
          RANLIB_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN_BIN }}/llvm-ranlib
          AARCH64_LINUX_ANDROID_RANLIB: ${{ env.ANDROID_TOOLCHAIN_BIN }}/llvm-ranlib
        run: pnpm android:build --ci --target aarch64 --apk --aab
      - name: Sign and verify Android artifacts
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          unsigned_apks=(src-tauri/gen/android/app/build/outputs/apk/**/*-unsigned.apk)
          signed_apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          filtered_apks=()
          for artifact in "${signed_apks[@]}"; do
            if [[ "$artifact" != *-unsigned* ]]; then
              filtered_apks+=("$artifact")
            fi
          done
          signed_apks=("${filtered_apks[@]}")
          if [ "${#unsigned_apks[@]}" -gt 0 ]; then
            if [ "${#unsigned_apks[@]}" -ne 1 ]; then
              echo "::error::未签名 APK 数量异常: ${#unsigned_apks[@]}"
              exit 1
            fi
            apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            signed_apk="$RUNNER_TEMP/AINote-${TAG}-android-arm64.apk"
            "$apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed_apk" \
              "${unsigned_apks[0]}"
            "$apksigner" verify --print-certs "$signed_apk"
          else
            if [ "${#signed_apks[@]}" -ne 1 ]; then
              echo "::error::已签名 APK 数量异常: ${#signed_apks[@]}"
              exit 1
            fi
            signed_apk="${signed_apks[0]}"
          fi
          aabs=(src-tauri/gen/android/app/build/outputs/bundle/**/*.aab)
          if [ "${#aabs[@]}" -ne 1 ]; then
            echo "::error::AAB 数量异常: ${#aabs[@]}"
            exit 1
          fi
          signed_aab="$RUNNER_TEMP/AINote-${TAG}.aab"
          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$signed_aab" \
            "${aabs[0]}" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$signed_aab"
          echo "ANDROID_APK_PATH=$signed_apk" >> "$GITHUB_ENV"
          echo "ANDROID_AAB_PATH=$signed_aab" >> "$GITHUB_ENV"
      - name: Upload Android artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_APK_PATH" ] || [ ! -s "$ANDROID_AAB_PATH" ]; then
            echo "::error::Android 签名产物缺失: $ANDROID_APK_PATH, $ANDROID_AAB_PATH"
            exit 1
          fi
          gh release upload "$TAG" "$ANDROID_APK_PATH" "$ANDROID_AAB_PATH" --clobber

  publish-updater-manifest:
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Build updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          download_url="https://github.com/$REPO/releases/download/$TAG"
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --clobber
          python3 - "$version" "$download_url" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          version, download_url = sys.argv[1:]
          signatures = {
              "app": ("AINote_aarch64.app.tar.gz.sig", "AINote_aarch64.app.tar.gz"),
              "msi": ("AINote_{version}_x64_en-US.msi.sig", "AINote_{version}_x64_en-US.msi"),
              "nsis": ("AINote_{version}_x64-setup.exe.sig", "AINote_{version}_x64-setup.exe"),
              "appimage": ("AINote_{version}_amd64.AppImage.sig", "AINote_{version}_amd64.AppImage"),
              "deb": ("AINote_{version}_amd64.deb.sig", "AINote_{version}_amd64.deb"),
              "rpm": ("AINote-{version}-1.x86_64.rpm.sig", "AINote-{version}-1.x86_64.rpm"),
          }

          def entry(kind: str) -> dict[str, str]:
              signature_name, asset_name = signatures[kind]
              return {
                  "signature": Path(signature_name.format(version=version)).read_text(encoding="utf-8").strip(),
                  "url": f"{download_url}/{asset_name.format(version=version)}",
              }

          manifest = {
              "version": version,
              "notes": "",
              "pub_date": datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": entry("app"),
                  "darwin-aarch64-app": entry("app"),
                  "windows-x86_64": entry("msi"),
                  "windows-x86_64-msi": entry("msi"),
                  "windows-x86_64-nsis": entry("nsis"),
                  "linux-x86_64": entry("appimage"),
                  "linux-x86_64-appimage": entry("appimage"),
                  "linux-x86_64-deb": entry("deb"),
                  "linux-x86_64-rpm": entry("rpm"),
              },
          }
          Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

  publish-release:
    needs: [create-release, publish-tauri, publish-android, publish-updater-manifest]
    runs-on: ubuntu-22.04
    steps:
      - name: Verify updater latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          asset_id=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json 资产缺失，发布被拦截"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$asset_id" > latest.json
          python3 - "$TAG" <<'PY'
          import json, sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          with open("latest.json", encoding="utf-8") as f:
              data = json.load(f)
          platforms = set(data.get("platforms", {}).keys())
          required = {
              "darwin-aarch64",
              "darwin-aarch64-app",
              "windows-x86_64",
              "windows-x86_64-msi",
              "windows-x86_64-nsis",
              "linux-x86_64",
              "linux-x86_64-appimage",
              "linux-x86_64-deb",
              "linux-x86_64-rpm",
          }
          missing = required - platforms
          if missing:
              print(f"::error::latest.json 缺少平台条目: {sorted(missing)}")
              sys.exit(1)
          if data.get("version") != version:
              print(f"::error::latest.json version {data.get('version')!r} != 期望 {version}")
              sys.exit(1)
          print(f"latest.json 校验通过: version={version}，平台 {len(platforms)} 个条目齐全")
          PY
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false >/dev/null
