[package]
name = "ainote-core"
version = "0.1.0"
edition = "2021"
description = "AINote - Git-native cross-platform markdown notes"

[lib]
name = "ainote_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = "0.20"
aes-gcm = "0.10.3"
getrandom = "0.2.17"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
