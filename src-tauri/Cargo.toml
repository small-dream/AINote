[package]
name = "mynote-core"
version = "0.1.0"
edition = "2021"
description = "MyNote - Git-native cross-platform markdown notes"

[lib]
name = "mynote_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = "0.20"
keyring = "3"

[dev-dependencies]
tempfile = "3"
